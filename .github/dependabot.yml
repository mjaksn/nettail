version: 2

# Actions, and the two packages this one is built on. Unlike netflume and
# lanname, this has dependencies: they are the halves of this program that
# were lifted out of it, and a release of either is worth being told about
# rather than finding out from a bug report.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 3

  # The base image the container is built on, which is pinned by digest in the
  # Dockerfile. A digest never moves on its own, so without this the image
  # would sit on whatever Debian and CPython shipped the day it was written.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 3
