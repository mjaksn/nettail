name: Release

# Tags only. Nothing here fires on a branch, so publishing is always a
# deliberate act with a version number attached to it.
#
# Publishing goes through a trusted publisher registered on PyPI: a GitHub
# publisher naming this repository, this workflow file, and the environment
# below. It exchanges a short-lived OIDC token at publish time, so there is no
# API token living in the repository secrets to leak or to rotate.
#
# It went in as a *pending* publisher, from the publishing page of the PyPI
# account, because there is no project to attach an ordinary one to until
# something has been uploaded and the first upload is the one that needs it.
# PyPI turned it into an ordinary publisher when that upload created the
# project, so there is nothing left to arrange here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: install the wheel, so the version below can be read from it
        # Unlike netflume and lanname, importing this package imports the two
        # it is built on, so the check below cannot read __version__ out of a
        # bare source tree. Installing what was just built also means the
        # number being compared is the one in the artefact about to be
        # published, rather than one read off the working directory.
        run: pip install dist/*.whl
      - name: the tag and the version must agree
        # A tag that disagrees with pyproject.toml (or the package's own
        # __version__) publishes something nobody can find again. Cheaper to
        # fail here than to yank a release.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          pkg_version="$(python -c 'import nettail; print(nettail.__version__)')"
          echo "tag $tag, pyproject $version, __version__ $pkg_version"
          [ "$tag" = "$version" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          }
          [ "$tag" = "$pkg_version" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match nettail.__version__ $pkg_version"
            exit 1
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributions
          path: dist/

  publish:
    name: publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the OIDC token trusted publishing exchanges
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  docker:
    name: build and push the image
    needs: [build]
    runs-on: ubuntu-latest
    # Behind `build` for its version check rather than behind `publish`: the
    # image does not contain the distributions and has nothing to wait for them
    # for, so it goes out alongside the upload rather than after it. What it
    # does need is the guarantee that the tag, pyproject.toml and __version__
    # agree, and that is what `build` establishes.
    permissions:
      contents: read
      packages: write        # GHCR, through the token this job already has
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU is what makes the two arm legs possible on an x86 runner. They
      # stay quick because the collector and both packages it is built on are
      # pure Python, so nothing is compiled under emulation.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: log in to GHCR
        # The workflow's own token, scoped by the `packages: write` above. No
        # secret to store and none to rotate, which is the same reasoning the
        # PyPI trusted publisher above rests on.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: log in to Docker Hub
        # Docker Hub has no equivalent of the exchange above, so this one is a
        # stored access token. It needs write access rather than only push,
        # because the description step below edits the repository.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: work out the tags
        id: meta
        # Both registries from one step, so the two can never be tagged
        # differently. The version comes from the git tag, which `build` has
        # already checked against pyproject.toml and nettail.__version__, so
        # the image is a fourth place the same number appears rather than an
        # independent opinion about it.
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
          # `latest` on a tag build only, which is every build this workflow
          # runs, since nothing here fires on a branch.
          flavor: latest=true

      - name: build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: put the README on the Docker Hub page
        # Docker Hub's overview is not part of the image. It is a field on the
        # repository, and neither `docker push` nor the OCI labels above touch
        # it, so without this step the page stays blank however good the labels
        # are. GHCR needs no equivalent: it reads the description and the source
        # link straight off the image.
        #
        # Pushed from README.md rather than written on the site, so there is one
        # account of what this is and the page quotes it, the same arrangement
        # the release notes and CHANGELOG.md already have.
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ github.repository }}
          readme-filepath: ./README.md
          # The overview only. Docker Hub caps the short description at 100
          # characters and the one this project uses everywhere else is longer,
          # so feeding it in would fail this step every time, after the image
          # had already gone out.

  release:
    name: create the GitHub release
    needs: [publish]
    runs-on: ubuntu-latest
    # The only job here that writes back to the repository, and the only one
    # with no use for the OIDC token the publish above exchanges. Kept apart so
    # that neither holds a permission the other needs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the notes come from the changelog
        # A release page written by hand would be a second account of a release
        # that CHANGELOG.md already gives, free to drift from it. The section
        # for the tag is lifted out instead, so there is one account and the
        # release page quotes it.
        #
        # A tag the changelog says nothing about fails here rather than
        # publishing an empty page, for the reason the version check above
        # fails: cheaper than editing a release after the fact.
        #
        # The heading itself is left behind. The title below already carries
        # the version, and the heading is a reference style link whose
        # definition sits at the foot of the changelog, so lifted out on its
        # own it would render as bare brackets.
        run: |
          python3 - <<'PY' > notes.md
          import os, pathlib, re, sys
          version = os.environ["GITHUB_REF_NAME"][1:]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          found = re.search(
              r"(?ms)^## \[%s\][^\n]*\n(.*?)(?=^## \[|^\[[0-9])"
              % re.escape(version),
              text)
          if found is None or not found.group(1).strip():
              raise SystemExit("CHANGELOG.md has no section for %s" % version)
          sys.stdout.write(found.group(1).strip() + "\n")
          PY
      - name: create the release
        # gh rather than an action, because the runner already has it and the
        # token it needs is the one the job was given. Nothing new to pin.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "nettail ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag
