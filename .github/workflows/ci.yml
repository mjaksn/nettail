name: CI

# Deliberately not on every push. A branch with no pull request open against
# it runs nothing, and a merge runs the suite once rather than twice:
#
#   pull_request       while a change is up for review, re-running on each
#                      push to it, so what passed is always the code being
#                      merged.
#   push to main       after the merge has happened.
#   workflow_dispatch  on demand, for a run nobody asked for by pushing.
#
# The pull_request trigger is what makes the requirement enforceable, and it
# is not interchangeable with dispatching by hand. A dispatched run does
# attach its checks to the branch head commit, but they do not enter the pull
# request's status check rollup, and the rollup, not the commit, is what a
# ruleset evaluates. A repository configured the other way shows a head commit
# covered in green checks while the merge stays blocked on an empty rollup. So
# dispatch is a convenience here, never the gate.
#
# The ruleset on main should require the `gate` job below and nothing else.
# Requiring the matrix jobs directly would mean naming all nine of them, and
# renaming one would quietly stop protecting anything.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: install the tools
        run: pip install ruff
      - name: ruff
        run: ruff check .
      # No mypy step, unlike netflume and lanname. Those two ship annotations
      # and a py.typed, so their types are part of what a consumer receives
      # and are worth checking. This is a program: nothing imports it for its
      # signatures, it carries no annotations to check, and a mypy run over it
      # would report on the two packages it calls rather than on anything
      # here. Add the step alongside the annotations if that ever changes.

  test:
    name: tests ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # 3.9 is no longer in the windows runner image's tool cache, so
          # setup-python spends the better part of a minute fetching an
          # interpreter to run a suite that takes seconds, and `gate` waits
          # for the slowest job, so that sits on the critical path of every
          # merge.
          #
          # Dropped rather than the whole of 3.9, because the two axes catch
          # different things. 3.9 catches syntax and stdlib incompatibility,
          # which is the same on either OS and is still covered on ubuntu.
          # Windows catches the terminal handling, which is where this program
          # differs most per platform, and which is still covered on four
          # versions. Only the intersection goes untested.
          - os: windows-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: install the two dependencies
        # The program is not installed, only what it imports. The suite runs
        # against the source tree, which is the code being reviewed.
        run: pip install "lanname>=0.2.0,<0.3" "netflume>=0.1.0,<0.2"
      - name: run the suite
        # Some suites reach the network, and only over loopback: they start
        # a real collector on 127.0.0.1 and send it NetFlow v5 datagrams,
        # and the web suites bind a port there and fetch over HTTP from it.
        # Nothing here leaves the runner.
        run: python tests/run.py

  build:
    name: build and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: build the distributions
        run: python -m build
      - name: check the metadata
        run: twine check dist/*
      - name: install the wheel somewhere else and run it
        # From another directory on purpose. Running from the repository root
        # would run the source tree and prove nothing about the wheel, which
        # is the thing anybody else actually receives.
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/python -m pip install --quiet dist/*.whl
          cd /tmp
          /tmp/probe/bin/nettail --help > /dev/null
          /tmp/probe/bin/python - <<'PY'
          import pathlib
          import nettail
          from nettail import services, web
          here = pathlib.Path(nettail.__file__).parent
          data = here / "supplemental-services"
          assert data.exists(), "supplemental-services missing from the wheel"
          assert services.load() is None, "the shipped list did not load"
          assert services.service_name(5353, 17) == "mdns", "5353 was not named"
          # The other file that has to be listed as package data. Left out, a
          # collector started with --web prints a URL that serves an error, so
          # it is checked here rather than discovered by somebody using it.
          page = here / "web.html"
          assert page.exists(), "web.html missing from the wheel"
          assert "<title>nettail</title>" in web.load_page(), "the page did not load"
          print("ran", nettail.__version__, "from", here)
          PY

  docker:
    name: the image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: build it
        # amd64 only, and no push. The point is that the Dockerfile still
        # builds and the image still starts. Whether emulation works is the
        # release workflow's problem, and it takes minutes rather than seconds
        # to answer.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: nettail:ci
      - name: start it and fetch the page it serves
        # A known token, so the URL can be built here rather than scraped out
        # of the banner. There is no unauthenticated route to ask instead:
        # everything the web interface serves is behind the token, which is
        # the point of it.
        #
        # The Host header is sent explicitly because the server checks it. That
        # rule is what stops DNS rebinding, and a request that skipped it would
        # be testing a weaker server than the one that ships.
        #
        # Host networking, because it is the only arrangement in which the web
        # view is reachable at all, and so the only one worth testing. The Host
        # rule compares against the address the connection arrived on; behind
        # the bridge that is the container's own 172.17.0.x, so a browser
        # asking for 127.0.0.1 is refused with the same 404 a bad token gets.
        # With host networking the local address is the host's and it matches.
        # The README says the same thing at more length.
        run: |
          docker run --detach --name probe --network host             nettail:ci --web --web-bind 127.0.0.1 --web-token ci-token
          for attempt in $(seq 1 30); do
            if curl --silent --fail --header 'Host: 127.0.0.1:2056'                  http://127.0.0.1:2056/t/ci-token/ > page.html; then
              break
            fi
            sleep 1
          done
          docker logs probe
          test -s page.html || {
            echo "::error::the container never served its page"
            exit 1
          }
      - name: a routable bind must say the container thing, not the host warning
        # The default CMD binds 0.0.0.0, which on a host would print the loud
        # warning about putting the network on a reachable address. In a
        # container that would fire on every single start and teach the reader
        # to skip the line that matters. This is the check that it does not.
        #
        # A second container, bridged, because this is about what is printed
        # rather than what is reachable, and the default CMD is what an
        # ordinary `docker run` gets.
        run: |
          docker run --detach --name warned nettail:ci
          sleep 5
          logs="$(docker logs warned 2>&1)"
          echo "$logs"
          echo "$logs" | grep -q "published port reaches it" || {
            echo "::error::the container did not print the container advice"
            exit 1
          }
          echo "$logs" | grep -q "travels in the clear" && {
            echo "::error::the container printed the host warning"
            exit 1
          }
          echo "the container printed the right line"
      - name: it must be running as the unprivileged user
        run: |
          who="$(docker exec probe id --user --name)"
          echo "running as $who"
          [ "$who" = "nettail" ] || {
            echo "::error::the container is running as $who, not nettail"
            exit 1
          }

  rehearsal:
    name: the publishing path still works
    # The image jobs in release.yml are a `uses:` apiece now, and what they
    # call lives in another repository. Left alone that is a file nothing
    # exercises until the next release, which is exactly the arrangement that
    # lets a thing rot silently and announce it by failing a release. So it is
    # called here as well, one platform and nothing pushed. About a minute,
    # and it proves the path rather than assuming it.
    permissions:
      contents: read
    uses: mjaksn/workflows/.github/workflows/publish-ghcr.yml@4e3dd222b30281d7c355286508542800ca5de33d
    with:
      platforms: linux/amd64
      push: false

  gate:
    name: gate
    # The single check for branch protection to require. Runs whatever the
    # others did, so a failure upstream is reported here rather than leaving
    # the gate skipped and the requirement satisfied by default.
    if: always()
    needs: [lint, test, build, docker, rehearsal]
    runs-on: ubuntu-latest
    steps:
      - name: every job must have succeeded
        run: |
          echo "lint  ${{ needs.lint.result }}"
          echo "test  ${{ needs.test.result }}"
          echo "build ${{ needs.build.result }}"
          echo "docker ${{ needs.docker.result }}"
          echo "rehearsal ${{ needs.rehearsal.result }}"
          [ "${{ needs.lint.result }}"  = "success" ] || exit 1
          [ "${{ needs.test.result }}"  = "success" ] || exit 1
          [ "${{ needs.build.result }}" = "success" ] || exit 1
          [ "${{ needs.docker.result }}" = "success" ] || exit 1
          [ "${{ needs.rehearsal.result }}" = "success" ] || exit 1
