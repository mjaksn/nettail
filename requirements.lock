# Exact runtime pins for the container image.
#
# pyproject.toml carries floors and ceilings, which is the right thing for
# anyone installing this beside other packages. This file is what the image
# installs, so that a rebuild of a released tag gets the same two packages it
# got the first time and an upstream release cannot change what the image does
# without somebody deciding it should.
#
# Both are halves of this program that grew up and left, both are published
# from repositories of mine, and neither has a dependency of its own. That is
# the whole runtime: two pure Python packages and the standard library.
#
# Each pin carries the sha256 of every file the index publishes for that
# version, and the image installs with --require-hashes. A version pin says
# what to install; the hashes say what the bytes must be.
#
# Every file is listed rather than only the one a given machine would pick.
# Both of these are pure Python and ship one wheel each, so today that is a
# short list, but a package that grew a compiled extension would need the rest
# and this way the file does not have to learn a new trick to cope.
#
# To refresh: edit the version pins below, then run scripts/lock_hashes.py to
# bring the hashes with them. It reads the index's own digests and downloads
# nothing.

