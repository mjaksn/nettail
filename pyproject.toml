[build-system]
requires = ["setuptools>=77"]        # PEP 639 licence expressions
build-backend = "setuptools.build_meta"

[project]
name = "nettail"
version = "0.16.0"
description = "A NetFlow v5, NetFlow v9 and IPFIX collector that prints flows to a console, with hostnames, colour, a live status bar and an optional browser view"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mjaksn" }]
keywords = ["netflow", "ipfix", "netflow9", "flow", "collector", "console", "monitoring", "network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
]

# Two, both of them halves of this program that grew up and left, and neither
# with dependencies of its own. So installing this brings in three pure Python
# packages and nothing else.
#
# Floors and ceilings rather than the exact pins a checkout used to carry.
# This is something people install beside other things, and `==` would make it
# a package that has to be uninstalled before anything else can move. The
# ceilings are not decoration: lanname 0.2.0 changed what a bare `Resolver()`
# does, from looking nothing up to querying reverse DNS, with nothing raised
# and nothing warned, and 0.4.0 changed `timeout` from a budget each probe got
# to one the two of them share. While both are on 0.x a minor bump is where
# that kind of change is allowed to live, so that is where the ceiling goes.
#
# netflume's ceiling was a floor decision for a while: 0.4.0 was the last
# release that supported Python 3.9, so `<0.5` held the decoder back to keep
# this program on an interpreter it no longer had a reason to be on. That
# question was answered the other way in 0.16.0, which is why the classifiers
# above start at 3.11, and the ceiling here is an ordinary one again.
#
# The floor is 0.5.2 rather than 0.5.0 because two things arrived inside that
# series that this program reads directly: 0.5.1 named six more information
# elements, which the dialog carries labels for and a test holds it to, and
# 0.5.2 dropped the ignored second argument to `flow_duration`, which is the
# spelling every call site here now uses.
dependencies = [
    "lanname>=0.5.0,<0.6",
    "netflume>=0.5.2,<0.6",
]

[project.scripts]
# The whole user interface. `python -m nettail` runs the same thing out of a
# checkout, which is what the test suite starts subprocesses with.
nettail = "nettail.cli:main"

[project.urls]
Homepage = "https://github.com/mjaksn/nettail"
Source = "https://github.com/mjaksn/nettail"
Issues = "https://github.com/mjaksn/nettail/issues"
Changelog = "https://github.com/mjaksn/nettail/blob/main/CHANGELOG.md"

[tool.setuptools]
# Named explicitly rather than auto-discovered: the flat layout puts `tests`
# beside the package, and discovery has been known to reach for it.
packages = ["nettail"]

[tool.setuptools.package-data]
# Files the program reads at startup rather than imports, so nothing would pull
# any of them into the wheel by itself. Each fails quietly and confusingly when
# left out, which is why they are named here and checked by the build job in CI
# rather than trusted to stay listed.
#
# Without the supplemental service list, every port the system services
# database does not know prints as a bare number, and the collector says so
# once at startup. Without web.html there is nothing to serve, so a collector
# started with --web prints a URL that answers every request with an error.
# Without flags.woff2 the browser view falls back to whatever emoji font the
# machine has, which on Windows draws a country's two letters in boxes rather
# than its flag; flags-licence says where that font came from and under what
# terms, and has to travel with it, since the artwork is CC BY 4.0 and asks
# for the credit to go wherever the material does.
nettail = ["supplemental-services", "web.html", "flags.woff2", "flags-licence"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Correctness and tidiness, not modernisation. The pyupgrade rules would ask
# for `X | None` and builtin generics, which the 3.11 floor now allows and
# which read better. Rewriting every annotation in the package is a change of
# spelling across every module, and it is worth making on its own rather than
# riding along with whatever moved the floor.
select = ["E", "F", "W", "I", "B"]
