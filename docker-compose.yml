# nettail under Docker Compose, serving the browser view.
#
#   docker compose up --detach
#   docker compose logs --follow        the console display, as it scrolls
#
# The URL with the token in it is printed at startup, so read the logs once
# after the first start. To pin it so that a bookmark survives a restart,
# uncomment the env_file block below and put NETTAIL_WEB_TOKEN in the file
# it names.

name: nettail

services:
  nettail:
    image: ghcr.io/mjaksn/nettail:latest
    container_name: nettail
    restart: unless-stopped

    # Host networking, and this is the setting that matters most here.
    #
    # A flow collector cares who sent the datagram: the EXPORTER column is the
    # address the packet came from. Behind Docker's bridge that address is
    # rewritten to the gateway, so every exporter on the network shows up as
    # 172.17.0.1 and they become impossible to tell apart. Host networking
    # keeps the real one.
    #
    # It also keeps the userland proxy out of the datagram path, which matters
    # on a busy network: the collector asks for a 4 MB receive buffer because
    # flow bursts are lossy, and a hop in front of that socket undoes some of
    # what the buffer is for.
    #
    # The cost is that this is a Linux arrangement. Docker Desktop on Windows
    # and macOS does not give a container the host's interfaces, so there the
    # ports section below has to be used instead, with the exporter address
    # wrong. See the README.
    network_mode: host

    # With host networking the container is already on the host's ports, so
    # nothing is published and nothing needs to be.
    #
    # Bridge networking loses the exporter address, as above, and it is the
    # only arrangement Docker Desktop offers. To use it, comment out
    # network_mode, publish both ports, and change --web-bind below to
    # 0.0.0.0: loopback inside the container's own namespace is unreachable
    # from a published port. The publish to 127.0.0.1 is then what keeps the
    # view private, and the same port number on both sides is what keeps the
    # Host check satisfied.
    #ports:
    #  - "2055:2055/udp"
    #  - "127.0.0.1:2056:2056"

    command:
      - --web
      # Loopback, not 0.0.0.0, because host networking means the host's own
      # loopback. This is the same guarantee the program gives outside a
      # container, and it needs no publish to keep it. The image's default
      # command asks for 0.0.0.0 instead, which is what a bridged run needs to
      # be reachable at all; here that would put the view on every interface.
      - --web-bind
      - 127.0.0.1
      # A name the view answers to. Under the loopback bind above it is added
      # beside localhost; under a routable --web-bind, which otherwise answers
      # to any name, the names listed here become the only ones it answers to.
      # Either way the printed URL carries the first.
      #- --web-host
      #- z2m
      # Serve the display but accept no keys from the browser.
      #- --web-readonly
      # Only flows that touch the internet, which is usually what is wanted.
      #- --external-only
      # Mark public addresses with the country a database says they are in.
      # No country data is in the image, so fetch one first with
      #   docker compose run --rm nettail --update-country-db
      # which puts it in the history volume below, and run the same command
      # again whenever you want a newer one. With nothing to read this says so
      # once at startup and marks nothing.
      #- --country

    # Pin the token so a bookmark survives a restart. Leave it out and a
    # fresh random one is printed at every start. It goes in a file rather
    # than on the command line so that it stays out of ps; nettail reads
    # NETTAIL_WEB_TOKEN itself.
    #env_file:
    #  - ./nettail.env        # NETTAIL_WEB_TOKEN=the-token-you-want-to-keep

    # The flow history, which the browser view scrolls back into and replays a
    # returning tab from. It is kept in /var/lib/nettail inside the container,
    # and a named volume there is what keeps it across a recreate: without one
    # it goes with the container, and every `docker compose pull` starts it
    # again from nothing. The totals and the tables are still held in memory
    # and start again on a restart, as they always have. Put `--flow-store off`
    # in the command above to keep no history at all.
    #
    # The same volume holds a country database fetched with
    # `--update-country-db`, as the note on `--country` above says. A run at a
    # terminal is offered one and a detached container is not, since it has
    # nobody to ask, so it goes without until the command fetches one.
    #
    # Two more things are worth mounting, both read-only because both are only
    # ever read. Your own static name mappings, if you keep any, paired with
    # `--hosts /etc/nettail/lan-hosts` in the command above. And a country
    # database you keep on the host yourself, in place of the fetched one:
    # /etc/nettail/country.mmdb is the first place nettail looks, so nothing
    # has to name it, and while it is mounted `--update-country-db` refuses to
    # fetch a copy that would be read after it and so never at all.
    volumes:
      - history:/var/lib/nettail
      #- ./lan-hosts:/etc/nettail/lan-hosts:ro
      #- ./dbip-country-lite.mmdb:/etc/nettail/country.mmdb:ro

volumes:
  history:
