<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>nettail</title>
<style>
:root {
  --ground: #0b1014;
  --panel: #121a20;
  --panel-2: #0e161b;
  --rule: #1f2c34;
  --ink: #d8e4ea;
  --ink-2: #93a7b2;
  --ink-3: #5f7481;
  --accent: #46c6de;
  --good: #57d68a;
  --warn: #e5b547;
  --bad: #f08585;
  --row-hover: #16222a;
  /* The padding on either side of a cell. Named because the column
     widths are a character count plus this, twice, and a padding
     changed in one place and not the other puts every column out. */
  --cell-pad: 8px;
}
@media (prefers-color-scheme: light) {
  :root {
    --ground: #f7f9fa;
    --panel: #ffffff;
    --panel-2: #eef3f5;
    --rule: #d5e0e5;
    --ink: #10191e;
    --ink-2: #4a5c66;
    --ink-3: #778a94;
    --accent: #0b6f8a;
    --good: #16773c;
    --warn: #8a5a08;
    --bad: #ae2323;
    --row-hover: #eaf2f5;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  /* "Country Flags" is the font this collector serves, and it is first
     because the script below registers it for the regional indicator letters
     and nothing else: every other character walks straight past it into the
     monospace fonts. No monospace font has a flag glyph, so without it the
     browser falls back to whatever emoji font the machine has, and on Windows
     that is Segoe UI Emoji, which draws the country's two letters in a pair
     of boxes. Those three are still named after the monospace ones as the
     fallback for a build with no font in it: they are what a Mac and a Linux
     desktop have anyway, and Segoe UI Emoji is last of them because it is the
     one that cannot draw a flag at all. */
  font: 13px/1.5 "Country Flags", ui-monospace, "SFMono-Regular",
        "Cascadia Mono", Menlo, Consolas, "DejaVu Sans Mono", "Twemoji Mozilla",
        "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", monospace;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  flex: none;
  border-bottom: 1px solid var(--rule);
  background: var(--panel);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.brand { font-weight: 700; color: var(--accent); letter-spacing: .04em; }
.where { color: var(--ink-2); }
.spacer { flex: 1 1 auto; }
.state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-2);
  white-space: nowrap;
}
.dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--ink-3); flex: none;
}
.state[data-live="yes"] .dot { background: var(--good); }
.state[data-live="retry"] .dot { background: var(--warn); }
.state[data-live="gone"] .dot { background: var(--bad); }
button {
  font: inherit;
  color: var(--ink-2);
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 3px 8px;
  cursor: pointer;
}
button:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* the key drawer */

#drawerToggle {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
}
#drawerToggle .caret {
  display: inline-block;
  transition: transform .12s ease;
  color: var(--ink-3);
}
#drawerToggle[aria-expanded="true"] {
  color: var(--ink);
  border-color: var(--accent);
}
#drawerToggle[aria-expanded="true"] .caret {
  transform: rotate(90deg);
  color: var(--accent);
}
#keys {
  flex: none;
  display: grid;
  /* Regular columns rather than a wrapped row, so the keys line up down the
     page and the eye can run along one column instead of hunting a ragged
     edge. The tracks stretch to fill whatever width there is. */
  grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
  gap: 4px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--rule);
  background: var(--panel-2);
  /* Wrapped descriptions make taller buttons, and a narrow window stacks them
     into more rows as well, so on a short screen the drawer could take most of
     it and leave the flows a sliver. It gets at most this much and scrolls,
     which is what the scrollbar rules below are for. */
  max-height: 40vh;
  overflow-y: auto;
}
#keys[hidden] { display: none; }
#keys button {
  /* Two tracks inside each button as well: every key glyph sits in a column of
     its own, so they line up with each other and not merely with their own
     descriptions.

     The first track is measured in ch rather than em because what goes in it
     is characters, and in this font em is narrower than one of them. Five is
     the longest key name the collector has, which is "space", plus the chip's
     own padding and borders. A name longer than that would push its chip past
     the track and knock the descriptions out of line, which is worth seeing;
     the alternative was cutting the word in half and saying nothing. */
  display: grid;
  grid-template-columns: calc(5ch + 14px) minmax(0, 1fr);
  align-items: baseline;
  gap: 8px;
  text-align: left;
  padding: 5px 9px;
  min-width: 0;
}
#keys button .k {
  color: var(--accent);
  font-weight: 700;
  text-align: center;
  background: var(--ground);
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 0 4px;
  white-space: nowrap;
}
#keys button .d {
  /* Wrapped rather than trimmed. These are whole sentences and most of them
     are longer than a column, so an ellipsis was hiding the half that said
     what the key does. A taller button costs nothing here: the grid gives
     every button in a row the height of the tallest, so the rows stay even. */
  color: var(--ink-2);
  white-space: normal;
  overflow-wrap: break-word;
}
#keys button:hover .d { color: var(--ink); }
#keys button[data-on="1"] {
  border-color: var(--accent);
  background: var(--row-hover);
}
#keys button[data-on="1"] .d { color: var(--ink); }
#keys button[data-on="1"] .k { background: var(--accent); color: var(--ground); }

/* the follow toggle */

.follow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-2);
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
}
.follow input {
  accent-color: var(--accent);
  margin: 0;
  cursor: pointer;
}
main { flex: 1 1 auto; overflow: auto; }
table { border-collapse: collapse; width: 100%; }
/* Fixed layout, sized by the colgroup the greeting's widths build.
   Under `table-layout: auto` a column is as wide as the widest cell
   in it, so the browser cannot place a new row without measuring
   every row already there, and the cost of showing one flow grows
   with the history behind it. Fixed, a column's width is settled
   before any row is read and an append costs the same at ten rows
   as at ten thousand.

   Addressed by its id, and that is the load-bearing part rather than
   a matter of taste. This began life as a bare `table` selector,
   written a release before the flow details dialog existed, and the
   dialog builds tables of its own in JavaScript with no colgroup and
   no width on any column. Fixed layout gives such a column an equal
   share of what is left, so every one of those tables divided itself
   into sixths: a peer's address and hostname wrapped to four lines
   while a packet count sat alone in eleven characters, a head label
   as ordinary as `Received` overflowed rather than widening, and the
   `overflow-x` those tables are wrapped in could never engage again,
   since a table at `width: 100%` that cannot outgrow its container
   has nothing to scroll. None of it fails a test, because nothing in
   the suite draws. The id is also what stops it coming back the next
   time somebody adds a table. */
#flows { table-layout: fixed; }
thead th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--panel);
  border-bottom: 1px solid var(--rule);
  color: var(--ink-3);
  font-weight: 700;
  text-align: left;
  letter-spacing: .08em;
  padding: 6px var(--cell-pad);
  white-space: nowrap;
}
thead th.r { text-align: right; }
tbody td {
  padding: 1px var(--cell-pad);
  white-space: pre;
  vertical-align: top;
  border-bottom: 1px solid transparent;
}
tbody td.r { text-align: right; }
/* The endpoint columns, which are the only ones that can hold something
   long. They wrap rather than widen, so a hostname nobody expected cannot
   push the table past the window and put a scrollbar under it. Table
   layout tries the full width first, so this costs nothing until it is
   the difference between wrapping and scrolling. */
tbody td.w { white-space: pre-wrap; overflow-wrap: anywhere; }
tbody tr.flow:hover td { background: var(--row-hover); }
/* Only a row the collector stamped a serial on can be asked about, so only
   that one says it can be clicked. Every flow published by a running
   collector carries one; a row that does not is one that arrived before the
   greeting it came with, and offering a pointer over it would be promising
   a dialog that then had nothing to look up. */
tbody tr.flow.ask { cursor: pointer; }
tbody tr.prose td {
  white-space: pre-wrap;
  padding: 6px 8px;
  color: var(--ink-2);
  border-left: 2px solid var(--rule);
  background: var(--panel-2);
}
tbody tr.prose[data-kind="summary"] td,
tbody tr.prose[data-kind="hosts"] td,
tbody tr.prose[data-kind="keys"] td { border-left-color: var(--accent); }
tbody tr.prose[data-kind="notice"] td { border-left-color: var(--warn); }
tbody tr.prose[data-kind="gap"] td { border-left-color: var(--bad); color: var(--bad); }
footer {
  flex: none;
  border-top: 1px solid var(--rule);
  background: var(--panel);
  padding: 6px 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  color: var(--ink-2);
}
footer span b { color: var(--ink); font-weight: 400; }
footer span i { color: var(--ink-3); font-style: normal; }
/* The country database's credit, which is owed rather than useful, so it is
   dimmed to the weight of a label and sits after everything about this run. */
footer span.credit { margin-left: auto; }
footer span.credit a { color: var(--ink-3); text-decoration: none; }
footer span.credit a:hover { color: var(--ink); text-decoration: underline; }
.paused { color: var(--warn); }
/* The seven ANSI colours this program uses, with white beside them for a code
   it does not write today, plus the 256 colour ramp behind the BYTES column.
   Named by code so the converter can map straight onto them. */
.a1 { font-weight: 700; }
.a2 { opacity: .6; }
.a31 { color: var(--bad); }
.a32 { color: var(--good); }
.a33 { color: var(--warn); }
.a34 { color: #6fa5f5; }
.a35 { color: #c98ae0; }
.a36 { color: var(--accent); }
.a37 { color: var(--ink); }
.a90 { color: var(--ink-3); }

/* the flow details dialog

   Large on purpose. What goes in it is two panels of facts, two endpoint
   panels with three tables each, and a panel for the pair, and the whole
   point of a dialog rather than a drawer is that there is room to lay them
   beside each other. The dialog is the scroller, not the regions inside it,
   so the reader scrolls one thing. */

#detail {
  width: min(96vw, 1400px);
  height: 92vh;
  max-width: none;
  max-height: none;
  padding: 0;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--ground);
  color: var(--ink);
  font: inherit;
  overflow: auto;
}
#detail::backdrop { background: rgba(0, 0, 0, .55); }
#detail .dhead {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--rule);
  background: var(--panel);
}
#detail .dtitle { font-weight: 700; color: var(--accent); }
#detail .dstatus {
  padding: 5px 12px;
  color: var(--ink-3);
  background: var(--panel-2);
  border-bottom: 1px solid var(--rule);
}
/* The three regions. Two panels fit side by side where there is room for
   them and stack where there is not, which is the same answer for the flow
   and datagram pair, the two endpoints, and the pair panel that is one panel
   wide whatever happens. */
#detail .dgrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(410px, 1fr));
  gap: 10px;
  padding: 10px 12px 0 12px;
}
#detail .dgrid:last-child { padding-bottom: 12px; }
#detail .dgrid:empty { display: none; }
#detail .panel {
  border: 1px solid var(--rule);
  border-radius: 3px;
  background: var(--panel);
  padding: 8px 10px;
  min-width: 0;
}
#detail .panel h2 {
  margin: 0 0 6px 0;
  font-size: 1em;
  color: var(--accent);
  letter-spacing: .06em;
}
/* A facts list is a label and a value, and the label column is as wide as
   its widest label rather than a guess: these are whole phrases, and units
   are part of them. */
#detail .facts {
  display: grid;
  grid-template-columns: minmax(0, auto) minmax(0, 1fr);
  gap: 0 12px;
}
#detail .facts .fl { color: var(--ink-3); }
#detail .facts .fv { color: var(--ink); overflow-wrap: anywhere; }
#detail .dtable { margin-top: 10px; overflow-x: auto; }
#detail .dth {
  color: var(--ink-2);
  border-bottom: 1px solid var(--rule);
  padding-bottom: 3px;
}
#detail table { width: 100%; }
/* Not pinned. The main table has one head and a window's worth of rows under
   it; a panel here has several short tables, and heads that stuck would pile
   up against each other at the top of the dialog as it scrolled. */
#detail thead th { position: static; padding: 3px var(--cell-pad); }
#detail tbody td { white-space: nowrap; padding: 1px var(--cell-pad); }
/* The first column of every table here holds a name: a protocol, a service,
   or a peer with its hostname after it. It is the only one that can be long,
   and it wraps rather than widening the table past the panel. */
#detail tbody td:first-child { white-space: pre-wrap; overflow-wrap: anywhere; }
#detail tbody tr:hover td { background: var(--row-hover); }
#detail .dmore { color: var(--ink-3); padding-top: 3px; }

/* Scrollbars, in the page's own colours rather than the browser's. The two
   syntaxes are not alternatives: the standard properties are what Firefox and
   recent Chrome read, the ::-webkit- rules are what everything built on older
   Blink and WebKit reads, and between them they cover what a person is likely
   to be looking at this in. */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--rule) transparent;
}
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--rule);
  border-radius: 6px;
  /* A transparent border with the track showing through it is how a thumb is
     inset without giving the track a colour of its own. */
  border: 2px solid transparent;
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--ink-3); background-clip: content-box; }
</style>
</head>
<body>
<header>
  <span class="brand">nettail</span>
  <span class="where" id="where"></span>
  <button type="button" id="drawerToggle" aria-expanded="false" aria-controls="keys" hidden>
    <span class="caret" aria-hidden="true">&#9656;</span><span>Keys</span>
  </button>
  <span class="spacer"></span>
  <label class="follow" id="followBox" hidden
         title="Whether new flows pull the view down. The down arrow toggles it.">
    <input type="checkbox" id="follow" checked>
    <span>Follow</span>
  </label>
  <span class="state" id="state" data-live="no"><span class="dot"></span><span id="stateText">connecting</span></span>
</header>
<div id="keys" hidden></div>
<main id="scroll">
  <table id="flows">
    <colgroup id="cols"></colgroup>
    <thead><tr id="head"></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<dialog id="detail">
  <div class="dhead">
    <span class="dtitle" id="detailTitle"></span>
    <span class="spacer"></span>
    <button type="button" id="detailRefresh">Refresh</button>
    <button type="button" id="detailClose">Close</button>
  </div>
  <div class="dstatus" id="detailStatus"></div>
  <div class="dgrid" id="detailFlow"></div>
  <div class="dgrid" id="detailEnds"></div>
  <div class="dgrid" id="detailPair"></div>
</dialog>
<footer id="status"><span><i>waiting for the collector</i></span></footer>
<script>
(function () {
  "use strict";

  // Everything is addressed relative to the token already in the path, so the
  // token is never written down here and never leaves the URL bar.
  var BASE = location.pathname.replace(/\/+$/, "");

  // The flags font, asked for only by a page that has flags to draw, and then
  // only once. `wantFlags` is called from the status handler when the
  // collector says it is marking countries, which is a fact about how it was
  // started and about the g key rather than anything the page can work out for
  // itself: a run without --country never shows a flag, and 78 KB it will
  // never draw a character with is 78 KB not worth sending.
  //
  // Fetched rather than declared in an @font-face, because that rule would
  // resolve its url against the page's own address, and that address is
  // whichever of the two forms the reader arrived by: the printed URL ends in
  // a slash and the same page answers without one. "flags.woff2" beside it
  // would therefore mean either the font or /t/flags.woff2, which is nothing,
  // depending on a trailing character nobody should have to keep. The stream
  // and the key route have the same problem and solve it the same way, with
  // BASE, and CSS has no way to say BASE. A <base> tag would, and the content
  // security policy refuses one on purpose. Declaring it would also hand the
  // decision above to the browser, which fetches an unicode-range face when a
  // character in the range is laid out: that is close to the right answer and
  // is not this one, since it would fetch on the first flag rather than not
  // at all.
  //
  // unicodeRange keeps the face to the one job even once it is here: it is
  // consulted for the regional indicator letters and nothing else, so a
  // machine that already draws flags goes on using its own font for every
  // other character on the page.
  //
  // Everything about it is allowed to fail. A build with no font in it answers
  // 404, and the emoji families in the stylesheet are what the page had before
  // the font was shipped.
  var askedForFlags = false;
  function wantFlags() {
    if (askedForFlags || !window.FontFace || !document.fonts) { return; }
    askedForFlags = true;
    try {
      var face = new FontFace(
        "Country Flags", 'url("' + BASE + '/flags.woff2") format("woff2")',
        { unicodeRange: "U+1F1E6-1F1FF" });
      face.load().then(function (loaded) { document.fonts.add(loaded); },
                       function () { /* no font, and the fallbacks stand */ });
    } catch (e) { /* the same */ }
  }

  // How many rows to keep. A busy link produces thousands a minute and a tab
  // left open for an hour would otherwise become unusable, so the oldest go and
  // the count of what went is shown rather than quietly dropped.
  var MAX_ROWS = 4000;
  var TRIM_TO = 3000;

  var rows = document.getElementById("rows");
  var head = document.getElementById("head");
  var colgroup = document.getElementById("cols");
  var keysBar = document.getElementById("keys");
  var statusBar = document.getElementById("status");
  var stateBox = document.getElementById("state");
  var stateText = document.getElementById("stateText");
  var whereBox = document.getElementById("where");
  var scroller = document.getElementById("scroll");
  var drawerToggle = document.getElementById("drawerToggle");

  var columns = [];
  var trimmed = 0;
  var readonly = true;
  var failures = 0;
  var greeted = false;
  // The live stream, or null when the tab has given it up.
  var stream = null;
  // The collector's count of flows shown, from the last status
  // that arrived. What `park` remembers and `reportMissed` uses.
  var lastFlowsShown = null;
  // Every key the collector will take from a browser, as characters. A
  // superset of the buttons, and the only thing the keydown handler asks.
  var pressable = [];

  // Whether new rows pull the view down with them. It used to be worked out
  // from the scroll position alone, which meant the only way to stop the page
  // moving under you was to keep hold of the scrollbar. It is a checkbox now,
  // and the scroll position sets it rather than being it: scroll up and the
  // box clears, scroll back to the bottom and it fills again. Either way what
  // the page is about to do is written down where it can be read and changed.
  var followBox = document.getElementById("follow");
  var followLabel = document.getElementById("followBox");

  function following() { return followBox.checked; }

  function toTail() { scroller.scrollTop = scroller.scrollHeight; }

  // ---- text off the wire is text, never markup -------------------------
  //
  // Hostnames come from reverse DNS, mDNS and NetBIOS. All three are things a
  // machine on this network can answer, which makes every one of them a string
  // somebody else chose. They arrive inside flow cells and inside the captured
  // prose, so nothing here ever assigns to innerHTML: every character reaches
  // the page through textContent, and the converter below builds spans and puts
  // text in them rather than assembling any markup at all.

  var SGR = /\x1b\[([0-9;]*)m/g;

  function cube(n) {
    // The 256 colour cube and its grey tail, which is what the size ramp uses.
    if (n < 16) { return null; }
    if (n < 232) {
      var i = n - 16;
      var f = [0, 95, 135, 175, 215, 255];
      return "rgb(" + f[Math.floor(i / 36) % 6] + "," +
             f[Math.floor(i / 6) % 6] + "," + f[i % 6] + ")";
    }
    var g = 8 + (n - 232) * 10;
    return "rgb(" + g + "," + g + "," + g + ")";
  }

  function ansi(text) {
    // A fragment of spans carrying the same colours the terminal was sent.
    var frag = document.createDocumentFragment();
    var classes = [];
    var colour = null;
    var at = 0;
    var match;
    SGR.lastIndex = 0;
    function emit(chunk) {
      if (!chunk) { return; }
      if (!classes.length && !colour) {
        frag.appendChild(document.createTextNode(chunk));
        return;
      }
      var span = document.createElement("span");
      if (classes.length) { span.className = classes.join(" "); }
      if (colour) { span.style.color = colour; }
      span.textContent = chunk;
      frag.appendChild(span);
    }
    while ((match = SGR.exec(text)) !== null) {
      emit(text.slice(at, match.index));
      at = match.index + match[0].length;
      var codes = match[1].split(";");
      for (var i = 0; i < codes.length; i++) {
        var code = parseInt(codes[i] || "0", 10);
        if (code === 38 && codes[i + 1] === "5") {
          colour = cube(parseInt(codes[i + 2], 10));
          i += 2;
        } else if (code === 0) {
          classes = [];
          colour = null;
        } else if (code === 39) {
          colour = null;
        } else if (code === 22) {
          classes = classes.filter(function (c) { return c !== "a1" && c !== "a2"; });
        } else if ((code >= 30 && code <= 37) || code === 90 ||
                   code === 1 || code === 2) {
          if (code >= 30) {
            classes = classes.filter(function (c) { return !/^a(3[0-7]|90)$/.test(c); });
          }
          classes.push("a" + code);
        }
      }
    }
    emit(text.slice(at));
    return frag;
  }

  // ---- the table -------------------------------------------------------

  // The head and the colgroup, both out of the widths the greeting
  // carried. The colgroup is what gives the fixed layout above something
  // to be fixed at: a width in characters is a width on the page, since
  // the font is monospace, so a column ends up exactly as wide as the
  // terminal draws it and the browser never has to read a row to find
  // out. The endpoint columns are the exception and are left to share
  // what remains, which is what lets a long hostname have the width of a
  // wide window rather than the forty characters an eighty column
  // terminal could spare it.
  function buildHead(cols) {
    columns = cols;
    head.textContent = "";
    colgroup.textContent = "";
    cols.forEach(function (col) {
      var sizer = document.createElement("col");
      if (!col.wrap && col.width) {
        sizer.style.width = "calc(" + col.width
                          + "ch + var(--cell-pad) * 2)";
      }
      colgroup.appendChild(sizer);

      var th = document.createElement("th");
      th.textContent = col.name;
      if (col.align === ">") { th.className = "r"; }
      head.appendChild(th);
    });
  }

  function atTail() {
    return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 24;
  }

  // ---- one frame, one append -------------------------------------------
  //
  // Nothing reaches the table as it arrives. A row is built when its event
  // comes in, held in a fragment, and put on the page once per animation
  // frame, with one call to `toTail` at the end of it.
  //
  // What that avoids is layout rather than the building. `toTail` reads
  // `scrollHeight`, which makes the browser lay the table out there and
  // then, so a queue turns one such read per event into one per frame. A
  // reconnect hands over a backlog of up to CLIENT_BACKLOG events in a
  // single task, and so does letting go of pause, and a task that stops to
  // measure the page thousands of times is, from the outside, a tab that
  // has frozen.
  //
  // What each of those measurements costs is the colgroup's business rather
  // than this one's. Under `table-layout: auto` a column is as wide as the
  // widest cell in it, so laying the table out is a pass over every row
  // there is and the cost of showing one flow grows with the history behind
  // it. The fixed layout settles the widths before a row is read and takes
  // that growth out. The batching is still worth having with it gone: the
  // order rows arrive in is what it keeps, and a measurement per frame is
  // cheaper than a measurement per event however cheap each one is.
  //
  // Everything that changes the table comes through here: flows, prose, the
  // notes the page writes itself, and the clear. That is what keeps them in
  // the order they arrived in, which a queue for some of them and a direct
  // append for the rest would not. The footer is the exception and is redrawn
  // as each status arrives, being two lines that no amount of history makes
  // more expensive, and being what says the collector is still there.
  var pending = document.createDocumentFragment();
  var pendingClear = false;
  var frame = 0;
  // Whether rows have gone since the gap row last said so. There are two
  // places they can go now, and the reader is told once, when the frame is
  // painted.
  var untold = false;

  function schedule() {
    if (!frame) { frame = window.requestAnimationFrame(paint); }
  }

  function queue(tr) {
    pending.appendChild(tr);
    // Trimmed here as well as at paint, because animation frames do not run in
    // a tab that is hidden or merely starved, and such a tab goes on taking
    // events until `park` closes the stream. Rows waiting to be shown cost
    // what rows on the page cost, so waiting is no reason to be exempt.
    keep();
    schedule();
  }

  function keep() {
    // The page and the queue behind it are one history and are bounded as one.
    // Trimming them separately would take the oldest of what is waiting while
    // older rows sat on the page untouched, and the gap would then be in the
    // middle of the history rather than at the top of it, which is not where
    // the note below says it is. So the oldest goes first, wherever the oldest
    // happens to be: everything on the page is older than everything queued.
    // Except while a clear is waiting for its frame, when what is on the page
    // is not history any more: it is going wholesale, and charging it to the
    // count would report thousands of rows dropped that the reader asked to be
    // rid of. It costs what it costs until `wipe` runs, which is no more than
    // it cost already, and the trim meanwhile takes the oldest of what the
    // page is about to hold instead.
    var held = pendingClear ? 0 : rows.childElementCount;
    var total = held + pending.childElementCount;
    if (total <= MAX_ROWS) { return; }
    while (total > TRIM_TO) {
      var list = held ? rows : pending;
      list.removeChild(list.firstElementChild);
      if (held) { held -= 1; }
      trimmed += 1;
      total -= 1;
    }
    // An extra line belongs to the flow above it, so a trim that took the
    // flow takes its lines with it rather than leaving them at the top of the
    // history under nothing. They are not counted as rows dropped: the flow
    // they describe was counted already, and a reader told that four thousand
    // rows went when three thousand flows did would be reading the wrong
    // number.
    while (true) {
      var lead = (held ? rows : pending).firstElementChild;
      if (!lead || lead.className !== "extra") { break; }
      (held ? rows : pending).removeChild(lead);
      if (held) { held -= 1; }
      total -= 1;
    }
    untold = true;
  }

  function wipe() {
    rows.textContent = "";
    scroller.scrollTop = 0;
    followBox.checked = true;
  }

  function paint() {
    frame = 0;
    // The clear goes first and the fragment holds only what arrived after it,
    // so a clear followed by flows inside one frame leaves the flows and
    // nothing else, exactly as it did when each event was applied on its own.
    if (pendingClear) {
      pendingClear = false;
      wipe();
    }
    if (pending.firstChild) {
      // A fragment hands its children over to whatever it is appended to, so
      // this is the single insertion the frame costs, whatever it is holding.
      rows.appendChild(pending);
      keep();
    }
    if (untold) {
      untold = false;
      // Straight on rather than through the queue: the note is about a trim
      // that has just happened, and queueing it would hold it back for a frame
      // that only arrives if something else does.
      rows.appendChild(noteRow("gap", trimmed.toLocaleString() +
        " earlier rows have been dropped to keep this page usable. " +
        "The collector still has them all in its totals."));
    }
    if (following()) { toTail(); }
  }

  function clearTable() {
    // Whatever was queued behind a clear goes with everything else. It was on
    // its way to a table the reader has just emptied, and showing it after the
    // clear would be the page answering a key with rows from before it.
    pending = document.createDocumentFragment();
    pendingClear = true;
    // The count of what has been dropped restarts here rather than in `wipe`,
    // which runs a frame later. A trim between the two belongs to the history
    // after the clear, and zeroing it at paint would drop those rows and say
    // nothing about them.
    trimmed = 0;
    untold = false;
    schedule();
  }

  function addFlow(payload) {
    var cells = payload.cells || [];
    var tr = document.createElement("tr");
    tr.className = "flow";
    // The serial and the two ends, kept on the row itself rather than in a
    // table beside it. A row is trimmed by `keep` from either end of the
    // history, and anything held elsewhere would have to be trimmed in step
    // with it; a property on the element is thrown away when the element is.
    if (typeof payload.n === "number") {
      tr.detail = { n: payload.n, ends: payload.ends || [null, null] };
      tr.className = "flow ask";
    }
    for (var i = 0; i < columns.length; i++) {
      var td = document.createElement("td");
      var classes = [];
      if (columns[i].align === ">") { classes.push("r"); }
      if (columns[i].wrap) { classes.push("w"); }
      if (classes.length) { td.className = classes.join(" "); }
      // Already unpadded by the collector, which is the side that can tell
      // padding from an escape sequence. Anything trimmed here would be a
      // second opinion about the same thing.
      td.appendChild(ansi(String(cells[i] === undefined ? "" : cells[i])));
      tr.appendChild(td);
    }
    queue(tr);
    // What the p and v keys put under the row, one row each, spanning the
    // table the way prose does. Queued after the flow and never before it, so
    // a trim taking the oldest from the front can separate the two but can
    // never reorder them. `keep` is what puts the front back together.
    (payload.extra || []).forEach(function (line) {
      var extra = document.createElement("tr");
      extra.className = "extra";
      var cell = document.createElement("td");
      cell.colSpan = Math.max(columns.length, 1);
      cell.appendChild(ansi(String(line)));
      extra.appendChild(cell);
      queue(extra);
    });
  }

  function addProse(kind, text) {
    var tr = document.createElement("tr");
    tr.className = "prose";
    tr.setAttribute("data-kind", kind);
    var td = document.createElement("td");
    td.colSpan = Math.max(columns.length, 1);
    td.appendChild(ansi(text.replace(/\n+$/, "")));
    tr.appendChild(td);
    queue(tr);
  }

  // Split from `note` because the trim inside `paint` needs the row without
  // putting it back on the queue it is already draining.
  function noteRow(kind, text) {
    var tr = document.createElement("tr");
    tr.className = "prose";
    tr.setAttribute("data-kind", kind);
    var td = document.createElement("td");
    td.colSpan = Math.max(columns.length, 1);
    td.textContent = text;
    tr.appendChild(td);
    return tr;
  }

  function note(kind, text) {
    queue(noteRow(kind, text));
  }

  // ---- the footer ------------------------------------------------------

  function field(label, value, extra) {
    var span = document.createElement("span");
    var i = document.createElement("i");
    i.textContent = label + " ";
    var b = document.createElement("b");
    b.textContent = value;
    if (extra) { b.className = extra; }
    span.appendChild(i);
    span.appendChild(b);
    return span;
  }

  // The credit a country database's licence asks for, as a link at the end of
  // the footer. Both the words and the address come from the collector, which
  // reads them off the file it opened: a page that wrote either down would be
  // crediting DB-IP for a database somebody else published the moment
  // --country-db pointed somewhere else. Built through textContent and
  // setAttribute for the reason everything here is, and pointed away with
  // noreferrer so that following it says nothing about where this page was.
  function creditLink(owed) {
    var a = document.createElement("a");
    a.textContent = owed.text;
    a.setAttribute("href", owed.url);
    a.setAttribute("target", "_blank");
    a.setAttribute("rel", "noreferrer noopener");
    var span = document.createElement("span");
    span.className = "credit";
    span.appendChild(a);
    return span;
  }

  function showStatus(payload) {
    if (!payload) { return; }
    if (typeof payload.flows_shown === "number") {
      lastFlowsShown = payload.flows_shown;
    }
    // Asked for here rather than in the greeting, so that the g key turning
    // the marking on mid-run is answered too: a status frame follows within a
    // repaint interval either way, and the greeting a late browser gets has
    // the last one spliced into it.
    if (payload.countries) { wantFlags(); }
    var s = payload.snap || {};
    var t = payload.shown || {};
    statusBar.textContent = "";
    statusBar.appendChild(field("up", t.elapsed || "-"));
    statusBar.appendChild(field("flows", t.flows || "0"));
    statusBar.appendChild(field("packets", t.packets || "0"));
    statusBar.appendChild(field("received", t.bytes_rx || "0"));
    statusBar.appendChild(field("rate", t.bit_rate || "0"));
    if (t.peak) { statusBar.appendChild(field("peak", t.peak)); }
    statusBar.appendChild(field("in/out", (t.inbound || "0") + " / " + (t.outbound || "0")));
    if (t.talker) { statusBar.appendChild(field("top", t.talker)); }
    statusBar.appendChild(field("names", t.resolve || "-"));
    if (s.sampling > 1) {
      statusBar.appendChild(field("sampling", "1-in-" + s.sampling, "paused"));
    }
    if (s.gaps) { statusBar.appendChild(field("gaps", String(s.gaps), "paused")); }
    if (s.parse_errors) {
      statusBar.appendChild(field("bad datagrams", String(s.parse_errors), "paused"));
    }
    if (s.external_only) { statusBar.appendChild(field("showing", "public only")); }
    if (s.paused) {
      statusBar.appendChild(field("paused", s.held + " held", "paused"));
    }
    if (trimmed) { statusBar.appendChild(field("rows dropped", trimmed.toLocaleString())); }
    // Last, because it is the one thing down here that is not about this run.
    if (payload.credit && payload.credit.text && payload.credit.url) {
      statusBar.appendChild(creditLink(payload.credit));
    }
    setToggles(payload.toggles || {});
    // The b key takes this footer down as well as the terminal's bar, which
    // is what it means by the status bar: one collector, and these are two
    // views of it. The credit stays whatever it says, and that is a licence
    // matter rather than a display one. The flags are still up in the rows
    // above, so the material is still on show, and CC BY 4.0 asks for the
    // attribution to be wherever the material is. A reader who wanted fewer
    // figures did not thereby waive DB-IP's credit.
    var quiet = !!(payload.toggles || {}).b;
    if (quiet) {
      statusBar.textContent = "";
      if (payload.credit && payload.credit.text && payload.credit.url) {
        statusBar.appendChild(creditLink(payload.credit));
      }
    }
    statusBar.hidden = quiet && !statusBar.firstChild;
  }

  // Buttons that mirror a setting show whether it is on. Read off the status
  // rather than tracked here, so a key pressed at the terminal or in another
  // browser moves this one too: there is one collector and these are views of
  // it, not four independent programs.
  //
  // Which keys those are is the collector's answer as well, and that is the
  // fix for a real defect rather than tidiness. This held a list of four, so
  // b, n, p, g and h never lit however they were pressed, and nothing failed:
  // a key missing from a table written over here was not wrong, it was
  // invisible. `Controls.toggles` is the one list now, and a key added there
  // arrives with its button already working.
  function setToggles(on) {
    Array.prototype.forEach.call(keysBar.children, function (button) {
      var key = button.getAttribute("data-key");
      if (key in on) { button.setAttribute("data-on", on[key] ? "1" : "0"); }
    });
  }

  // ---- asking about one flow -------------------------------------------
  //
  // Clicking a row asks the collector about it and shows the answer in a
  // dialog. The collector is the only thing that can answer: the statistics
  // live on the receive thread and every value in the report is written out
  // in Python, for the reason the table head and the buttons come over the
  // wire rather than being typed here. So this half is the click, the ask,
  // and two renderers, one for a list of facts and one for a table.
  //
  // The ask goes out over the control route and the answer comes back on the
  // stream, which is what lets the collector answer it on the thread that
  // owns the figures. Every browser watching receives every answer, so each
  // one is stamped with the id of the ask it belongs to and a page ignores
  // the ones that are not its own.
  //
  // The colour is the collector's too. Every value and every table cell
  // arrives painted in the same escape codes a flow row carries, in the
  // vocabulary the terminal and the traffic summary already use, so both
  // renderers below put their text on the page through ansi() rather than
  // straight into textContent. Nothing here decides that an address is public
  // or that a protocol is TCP; it renders what it was handed, exactly as it
  // does for a row. The titles are the exception and stay on textContent,
  // because the panel headings and the dialog's own are styled by this page
  // and are not painted at the other end. Painting one there without changing
  // this would show a reader the escape codes, and nothing would fail.

  var detail = document.getElementById("detail");
  var detailTitle = document.getElementById("detailTitle");
  var detailStatus = document.getElementById("detailStatus");
  var detailFlow = document.getElementById("detailFlow");
  var detailEnds = document.getElementById("detailEnds");
  var detailPair = document.getElementById("detailPair");

  // How long to wait for an answer before saying so. A reply can be lost:
  // this browser's queue on the collector is bounded, and a page far enough
  // behind loses the oldest events in it. Saying "asking the collector" for
  // ever would be the page presenting a lost frame as a slow one.
  var ASK_WAIT = 8000;

  // How often the dialog asks again, from the greeting, and 0 for not at all.
  var detailRefreshMs = 5000;
  // The last id sent. A reply carrying anything else is somebody else's, or
  // is ours from before the dialog was closed and reopened.
  var askId = 0;
  // The id still waiting for a reply, or 0.
  var awaiting = 0;
  var askRow = null;
  var askTimer = 0;
  var waitTimer = 0;

  function stopAsking() {
    if (askTimer) { window.clearInterval(askTimer); askTimer = 0; }
    if (waitTimer) { window.clearTimeout(waitTimer); waitTimer = 0; }
    awaiting = 0;
  }

  function openDetail(tr) {
    askRow = tr;
    detailTitle.textContent = "";
    detailFlow.textContent = "";
    detailEnds.textContent = "";
    detailPair.textContent = "";
    if (!detail.open) { detail.showModal(); }
    // Cleared before a new one is started, so that opening and closing twice
    // cannot leave two timers asking.
    stopAsking();
    if (detailRefreshMs > 0) {
      askTimer = window.setInterval(askAgain, detailRefreshMs);
    }
    askAgain();
  }

  function askAgain() {
    if (!askRow) { return; }
    var what = askRow.detail || { n: null, ends: [null, null] };
    askId += 1;
    awaiting = askId;
    var mine = askId;
    detailStatus.textContent = "asking the collector";
    if (waitTimer) { window.clearTimeout(waitTimer); }
    waitTimer = window.setTimeout(function () {
      waitTimer = 0;
      if (awaiting === mine) {
        detailStatus.textContent = "no answer from the collector. " +
          "Press Refresh to ask again.";
      }
    }, ASK_WAIT);
    fetch(BASE + "/detail", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ask: mine, n: what.n, ends: what.ends })
    }).then(function (response) {
      // The refusal goes in the dialog rather than into the table under it:
      // it is about this dialog and nothing else, and a gap row would put it
      // in front of a reader who may not even have one open. The timer is
      // left running, so the next tick tries again on its own.
      if (!response.ok && awaiting === mine) {
        detailStatus.textContent = "the collector refused that request (" +
          response.status + "). Press Refresh to try again.";
      }
    }).catch(function () {
      if (awaiting === mine) {
        detailStatus.textContent = "could not reach the collector. " +
          "Press Refresh to try again.";
      }
    });
  }

  function factsList(facts) {
    var wrap = document.createElement("div");
    wrap.className = "facts";
    facts.forEach(function (fact) {
      var label = document.createElement("span");
      label.className = "fl";
      label.textContent = fact[0];
      var value = document.createElement("span");
      value.className = "fv";
      value.appendChild(ansi(String(fact[1] === undefined ? "" : fact[1])));
      wrap.appendChild(label);
      wrap.appendChild(value);
    });
    return wrap;
  }

  function factTable(spec) {
    var head = spec.head || [];
    var wrap = document.createElement("div");
    wrap.className = "dtable";
    var caption = document.createElement("div");
    caption.className = "dth";
    caption.textContent = spec.title;
    wrap.appendChild(caption);
    var table = document.createElement("table");
    var thead = document.createElement("thead");
    var headRow = document.createElement("tr");
    head.forEach(function (col) {
      var th = document.createElement("th");
      th.textContent = col[0];
      if (col[1] === ">") { th.className = "r"; }
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);
    var body = document.createElement("tbody");
    (spec.rows || []).forEach(function (cells) {
      var tr = document.createElement("tr");
      cells.forEach(function (cell, i) {
        var td = document.createElement("td");
        if (head[i] && head[i][1] === ">") { td.className = "r"; }
        td.appendChild(ansi(String(cell === undefined ? "" : cell)));
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
    table.appendChild(body);
    wrap.appendChild(table);
    if (spec.more) {
      var more = document.createElement("div");
      more.className = "dmore";
      more.textContent = spec.more.toLocaleString() + " more, not shown";
      wrap.appendChild(more);
    }
    return wrap;
  }

  function panel(section) {
    var box = document.createElement("section");
    box.className = "panel";
    var title = document.createElement("h2");
    title.textContent = section.title || "";
    box.appendChild(title);
    if ((section.facts || []).length) {
      box.appendChild(factsList(section.facts));
    }
    (section.tables || []).forEach(function (spec) {
      box.appendChild(factTable(spec));
    });
    return box;
  }

  // Built into a fragment and swapped in, rather than the dialog being torn
  // down and put back. A refresh arrives every few seconds and the reader may
  // be halfway down a peer table when it does; replacing the three regions'
  // children leaves the dialog itself, and the scroll position with it, where
  // they were.
  function fill(region, sections) {
    var frag = document.createDocumentFragment();
    sections.forEach(function (section) { frag.appendChild(panel(section)); });
    region.textContent = "";
    region.appendChild(frag);
  }

  function renderDetail(payload) {
    awaiting = 0;
    if (waitTimer) { window.clearTimeout(waitTimer); waitTimer = 0; }
    detailTitle.textContent = payload.title || "";
    fill(detailFlow, payload.sections || []);
    fill(detailEnds, payload.ends || []);
    fill(detailPair, payload.pair ? [payload.pair] : []);
    var taken = new Date().toLocaleTimeString();
    detailStatus.textContent = detailRefreshMs > 0
      ? "figures as they were at " + taken + ", and again every " +
        (detailRefreshMs / 1000) + "s"
      : "figures as they were at " + taken +
        ", and held there until Refresh is pressed";
  }

  // One listener on the table rather than one per row. Rows arrive thousands
  // at a time and are trimmed the same way, and a listener each would be a
  // listener each to remove.
  rows.addEventListener("click", function (event) {
    var target = event.target;
    var tr = target && target.closest ? target.closest("tr.flow") : null;
    if (!tr || !tr.detail) { return; }
    openDetail(tr);
  });

  document.getElementById("detailRefresh").addEventListener("click", askAgain);
  document.getElementById("detailClose").addEventListener("click", function () {
    detail.close();
  });

  // The backdrop, which every other dialog on the web closes on. Told apart
  // by where the click landed rather than by what it landed on: a click on
  // the backdrop targets the dialog element, and so do two clicks that are
  // plainly inside it. The dialog is a fixed 92vh, so a short report leaves
  // empty space below its panels, and the dialog is its own scroller, so
  // letting go of its scrollbar is a click on it too. Closing on either would
  // be the reader losing the dialog for reading it.
  detail.addEventListener("click", function (event) {
    if (event.target !== detail) { return; }
    var box = detail.getBoundingClientRect();
    var outside = event.clientX < box.left || event.clientX > box.right ||
                  event.clientY < box.top || event.clientY > box.bottom;
    if (outside) { detail.close(); }
  });

  // Everything that stops the dialog goes through this one listener, so the
  // Escape key, the backdrop, the Close button and `park` all leave the same
  // state behind: no timer, no outstanding ask, and no row to ask about. The
  // id is stepped on so that a reply already on its way is not rendered into
  // a dialog the reader has closed.
  detail.addEventListener("close", function () {
    stopAsking();
    askId += 1;
    askRow = null;
  });

  // ---- keys ------------------------------------------------------------

  function press(key, value) {
    if (readonly) { return; }
    var body = value === undefined || value === null
      ? JSON.stringify({ key: key })
      : JSON.stringify({ key: key, value: value });
    fetch(BASE + "/key", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: body
    }).then(function (response) {
      if (!response.ok) {
        note("gap", "the collector refused that key (" + response.status + ")");
      }
    }).catch(function () {
      note("gap", "could not reach the collector to send that key");
    });
  }

  // The one key that asks a question. The terminal answers it by typing a
  // line; here it is a prompt, and the answer travels with the key.
  var ASKS = { m: "New top of the size scale. K, M, G and T are accepted:" };

  function send(key) {
    if (key in ASKS) {
      var typed = window.prompt(ASKS[key]);
      if (typed === null || typed === "") { return; }
      press(key, typed);
      return;
    }
    press(key);
  }

  // The drawer. Shut to begin with, because the flows are what the page is
  // for and a reader who wants the keys can ask. What it holds is the same
  // table the terminal's ? key prints, which is why that key gets no button
  // of its own: it would be describing the buttons next to the buttons. The
  // key still works, and the listing it prints still arrives as prose.
  var DRAWER_KEY = "nettail.keys.open";

  function setDrawer(open) {
    keysBar.hidden = !open;
    drawerToggle.setAttribute("aria-expanded", open ? "true" : "false");
    try {
      window.localStorage.setItem(DRAWER_KEY, open ? "1" : "0");
    } catch (err) {
      // Private windows and blocked site data both throw here. Remembering
      // whether the drawer was open is a convenience and not worth a broken
      // page, so the preference is simply not kept.
    }
    // Opening the drawer takes height from the flows, so a page that was
    // following the tail has to be put back on it.
    if (following()) { toTail(); }
  }

  function drawerWasOpen() {
    try {
      return window.localStorage.getItem(DRAWER_KEY) === "1";
    } catch (err) {
      return false;
    }
  }

  drawerToggle.addEventListener("click", function () {
    setDrawer(keysBar.hidden);
  });

  function buildKeys(keys) {
    keysBar.textContent = "";
    if (readonly) {
      drawerToggle.hidden = true;
      setDrawer(false);
      return;
    }
    keys.forEach(function (entry) {
      var button = document.createElement("button");
      button.type = "button";
      button.setAttribute("data-key", entry.key === "space" ? " " : entry.key);
      button.title = entry.doc;
      var glyph = document.createElement("span");
      glyph.className = "k";
      glyph.textContent = entry.key;
      var doc = document.createElement("span");
      doc.className = "d";
      doc.textContent = entry.doc;
      button.appendChild(glyph);
      button.appendChild(doc);
      button.addEventListener("click", function () {
        send(button.getAttribute("data-key"));
      });
      keysBar.appendChild(button);
    });
    drawerToggle.hidden = false;
    setDrawer(drawerWasOpen());
  }

  document.addEventListener("keydown", function (event) {
    // Nothing is forwarded while the dialog is up. It is the reader's focus
    // and their keystrokes belong to it, and the one that matters is x, which
    // would otherwise clear the table underneath a dialog opened from a row
    // in it. Escape is not forwarded from here in any case: it is in the
    // collector's WEB_EXCLUDED, and it is what closes a dialog natively.
    if (detail.open) { return; }
    if (event.ctrlKey || event.metaKey || event.altKey) { return; }
    // The down arrow works the Follow box, and is answered here rather than
    // sent to the collector. Following the tail is this tab's own business:
    // the collector has no name for it, no state holding it and nothing to
    // toggle, and two browsers watching one run scroll independently. That is
    // also why it is above the readonly guard rather than below it. Nothing
    // about it leaves the page, so a collector serving the display only has
    // nothing to refuse, and a reader watching a --web-readonly session is
    // the reader most likely to want to stop the view moving while they read.
    //
    // It is above the input guard for a duller reason: clicking the box
    // leaves the focus on it, so the arrow pressed straight afterwards, which
    // is the natural way to change your mind, would otherwise do nothing.
    //
    // preventDefault is load-bearing here and not tidiness. Where a browser
    // answers the down arrow by scrolling, that fires the scroll handler at
    // the foot of this file, which sets the box from the scroll position, and
    // at the tail it would put back the tick this keypress has just taken off.
    // Whether it does scroll is not ours to know: the body is overflow hidden
    // and the flows scroll inside main, so it depends on what the browser has
    // decided to focus. A guard against the case, rather than a fix for it.
    if (event.key === "ArrowDown") {
      event.preventDefault();
      // click() rather than assigning checked, which fires no change event.
      // The handler at the foot of this file stays the one place that decides
      // what turning Follow back on does.
      followBox.click();
      return;
    }
    if (readonly) { return; }
    var target = event.target;
    if (target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA")) {
      return;
    }
    var key = event.key === " " ? " " : event.key.toLowerCase();
    // Against what the collector says it accepts, not against what has a
    // button. The two are not the same list: the help key is pressable and has
    // no button, because the drawer is already the answer it would print. A
    // plain membership test also cannot throw the way building a selector out
    // of a keystroke could.
    if (pressable.indexOf(key) < 0) { return; }
    event.preventDefault();
    send(key);
  });

  // ---- the stream ------------------------------------------------------

  function setState(live, text) {
    stateBox.setAttribute("data-live", live);
    stateText.textContent = text;
  }

  // ---- being in the background ----------------------------------------
  //
  // A hidden tab is throttled and, after a few minutes, may be frozen outright.
  // No script of ours runs then, but the browser goes on reading the socket and
  // buffering what arrives, and on a busy link that buffer grows without limit
  // until the tab is killed for memory. Nothing the page does while it is
  // running can help, because by then the memory has already been spent: the
  // only thing that stops it is not having the connection open.
  //
  // So a tab that goes to the background gives up its stream, and takes it back
  // when it returns. The collector gets its watcher slot back at the same time.
  //
  // Three things ask for it, because no one of them covers the others. The
  // visibility flag is the quick and ordinary one. The freeze event is the
  // load-bearing one: the buffer is itself what puts the tab under memory
  // pressure, and a tab frozen for it stops running the very timer that would
  // have closed the connection, so the buffering that caused the freeze then
  // survives it. And the page watches its own clock, because a window that is
  // merely starved, which minimising one reliably does, may never be marked
  // hidden and never be frozen, and is still a tab not running often enough to
  // drain a stream. All three go through `park`, so the count on the way back
  // works the same whichever of them noticed.
  //
  // Not immediately, though. Switching to another tab and straight back is the
  // common case and should cost nothing, and the collector needs a moment to
  // notice a closed connection before it will accept a new one, so a quick
  // return could otherwise be turned away by the watcher cap. The grace period
  // covers both. It is measured in what a hidden tab's timers do, which is
  // approximate: this may fire late, and that is fine, since a few extra
  // seconds of buffering is not what kills anything.
  var HIDE_GRACE = 15000;
  var hideTimer = 0;
  // Whether the page gave the stream up itself. Not the same question as
  // whether there is one: a refused connection and one abandoned after five
  // failures both leave `stream` null, and neither should be quietly
  // reopened by the clock watcher below.
  var parked = false;
  // Set when the page has stopped trying: refused outright, or given up after
  // five failures. Both tell the reader to reload, and neither should be
  // undone by a tab switch or by the clock watcher.
  var gaveUp = false;
  // The flow count when the stream was given up, or null when it is live. The
  // page cannot count what it missed, because nothing reached it, so it asks
  // the collector: this is subtracted from the same figure on the way back.
  //
  // The figure has to come from a status frame and not from the greeting. The
  // collector publishes nothing while nobody is watching, which is exactly the
  // stretch this is about, so the status spliced into a greeting is the one
  // from before the stream was given up: subtracting it from itself is always
  // zero. A real status follows within a repaint interval and carries the
  // figure as it is now, so the report waits for that.
  var parkedAt = null;
  // Whether the page was following the tail when the tab was hidden,
  // or null while it is in front.
  var hiddenFollowing = null;

  function flowsShown(status) {
    return status && typeof status.flows_shown === "number"
      ? status.flows_shown : null;
  }

  function park() {
    // Whichever cause arrived first, a grace timer still pending must not
    // outlive it. Left to run, it fires after the tab is back and the stream
    // is live again, and parks a tab somebody is looking at.
    if (hideTimer) { window.clearTimeout(hideTimer); }
    hideTimer = 0;
    if (!stream) { return; }
    // The visibility path notes this on its way out, before the grace runs.
    // The other two have no way out to note it on, so they take it here.
    if (hiddenFollowing === null) { hiddenFollowing = following(); }
    parked = true;
    parkedAt = lastFlowsShown;
    // The answer to an ask comes back on the stream, so a dialog left open
    // over a parked one would sit on "asking the collector" until the tab
    // came back. Closing it stops its timer through the close listener.
    if (detail.open) { detail.close(); }
    stream.close();
    stream = null;
    // The clock watcher can reach a tab that is plainly in front of somebody,
    // after a laptop wake or any long stall, and telling them it is in the
    // background would be telling them something they can see is untrue.
    setState("no", document.hidden ? "paused in the background"
                                   : "paused, this tab was not being run");
  }

  function restoreFollowing() {
    if (hiddenFollowing === null) { return; }
    // Following means the tail is where the reader wants to be, so that is
    // where they are put, without waiting for the next flow to arrive and
    // carry them there. A tab that comes back to a quiet network would
    // otherwise sit wherever it happened to be until something turned up.
    followBox.checked = hiddenFollowing;
    hiddenFollowing = null;
    if (following()) { toTail(); }
  }

  function takeBack() {
    // Both of the branches that give up for good say to reload, so retrying
    // behind the reader's back would be the page contradicting its own notice.
    if (gaveUp) { return; }
    failures = 0;
    setState("retry", "reconnecting");
    connect();
    restoreFollowing();
  }

  function reportMissed(status) {
    var now = flowsShown(status);
    var then = parkedAt;
    parkedAt = null;
    if (now === null || then === null) { return; }
    var missed = now - then;
    if (missed > 0) {
      note("gap", missed.toLocaleString() + " flow" + (missed === 1 ? "" : "s") +
           " arrived while this tab was in the background. The collector has " +
           "them in its totals; they were not kept for the page.");
    } else if (missed < 0) {
      // The c key clears the statistics and the counter with them, so a
      // negative difference is not a miscount, it is a different session.
      note("gap", "The collector's statistics were cleared while this tab " +
           "was in the background.");
    }
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      // Remembered on the way out rather than read on the way back. Nothing
      // here changes it while the tab is hidden, but a resize or a restored
      // scroll position can fire a scroll event, and the scroll handler is
      // what sets the box: coming back to find the page had quietly stopped
      // following would be the sort of thing nobody could explain.
      hiddenFollowing = following();
      if (!hideTimer && stream) {
        hideTimer = window.setTimeout(park, HIDE_GRACE);
      }
      return;
    }
    if (hideTimer) {
      window.clearTimeout(hideTimer);
      hideTimer = 0;
    }
    if (!stream) { takeBack(); }
    // Also for the tab that came back inside the grace, where nothing was
    // given up and `takeBack` was never called.
    restoreFollowing();
  });

  // Chrome says so just before it freezes a tab, and giving up what is open is
  // what the event is for. No grace here: there is nowhere to put one, since a
  // frozen tab runs no timers at all, and a freeze landing inside the fifteen
  // seconds above is exactly the case where the stream would otherwise be held
  // open for as long as the tab stayed away.
  document.addEventListener("freeze", park);

  // How often the page checks that it is still being run, how late a check has
  // to be before that answer is no, and how many punctual ones it takes to
  // believe a parked tab is back in front of somebody. Ten seconds is well
  // past a slow frame or a burst of rows on the main thread, so a foreground
  // stall is not mistaken for a starved tab; a starved one is scheduled in
  // bursts, so a single punctual tick is not evidence of anything.
  var BEAT = 1000;
  var BEAT_LATE = 10000;
  var BEAT_STEADY = 3;
  var beatAt = Date.now();
  var steady = 0;

  window.setInterval(function () {
    var now = Date.now();
    var late = now - beatAt - BEAT;
    beatAt = now;
    if (late > BEAT_LATE) {
      // Whatever the visibility flag says, a page being run this seldom is
      // not draining anything, and the browser is still filling the buffer.
      steady = 0;
      park();
      return;
    }
    if (!parked || document.hidden) { steady = 0; return; }
    steady += 1;
    if (steady >= BEAT_STEADY) {
      steady = 0;
      takeBack();
    }
  }, BEAT);

  function connect() {
    parked = false;
    // The clock watcher measures from here too. A tick held back by whatever
    // the page has just come out of would otherwise be read as the page still
    // being starved, and would park the connection it has only now opened.
    beatAt = Date.now();
    steady = 0;
    // Held on the closure as well as locally. `park` below has to be able to
    // close whichever stream is current, and every handler works from its own
    // `es` so that one left over from a previous connection cannot answer for
    // the one that replaced it.
    var es = new EventSource(BASE + "/events");
    stream = es;

    es.addEventListener("hello", function (event) {
      var hello = JSON.parse(event.data);
      failures = 0;
      setState("yes", "watching");
      var status = hello.status;
      if (!greeted) {
        greeted = true;
        readonly = !!hello.readonly;
        // How the collector was started, like readonly and json beside it.
        // The dialog works under --web-readonly, which is why this is read
        // whatever that says: asking what a flow was changes nothing.
        if (typeof hello.detail_refresh === "number") {
          detailRefreshMs = Math.max(hello.detail_refresh, 0) * 1000;
        }
        buildHead(hello.columns || []);
        buildKeys(hello.keys || []);
        pressable = hello.pressable || [];
        document.title = "nettail " + (hello.nettail || "");
        followLabel.hidden = false;
        whereBox.textContent = hello.json
          ? "mirroring the terminal, with json on stdout"
          : "mirroring the terminal";
        if (hello.banner) { addProse("banner", hello.banner); }
        if (readonly) {
          note("notice", "This collector is serving the display only. " +
               "Keys are not taken from the browser.");
        }
      } else if (parkedAt === null) {
        note("notice", "reconnected to the collector");
      }
      if (status) { showStatus(status); }
    });

    es.addEventListener("flow", function (event) {
      addFlow(JSON.parse(event.data));
    });

    es.addEventListener("status", function (event) {
      var payload = JSON.parse(event.data);
      showStatus(payload);
      // The first of these after coming back is the first figure that counts
      // the gap. `reportMissed` clears `parkedAt`, so the ones after it pass
      // straight through.
      if (parkedAt !== null) { reportMissed(payload); }
    });

    es.addEventListener("prose", function (event) {
      var payload = JSON.parse(event.data);
      addProse(payload.kind || "notice", payload.text || "");
    });

    es.addEventListener("clear", function () {
      clearTable();
    });

    es.addEventListener("detail", function (event) {
      var payload = JSON.parse(event.data);
      // Every watcher is sent every answer, so this is where a page picks out
      // its own. A reply from before the dialog was closed fails the same
      // test, because closing steps the id on.
      if (!detail.open || payload.ask !== askId) { return; }
      renderDetail(payload);
    });

    es.addEventListener("dropped", function (event) {
      var payload = JSON.parse(event.data);
      note("gap", payload.count.toLocaleString() +
           " events were dropped: this browser fell behind the collector.");
    });

    es.onerror = function () {
      if (es.readyState === EventSource.CLOSED) {
        // The server answered with something that was not a 200, which by the
        // specification fails the connection for good rather than retrying.
        // The retry branch below never sees this, so without saying something
        // here the reader is left on "connecting" for ever while the server's
        // explanation goes nowhere. The commonest way to arrive is to be the
        // fifth tab: the collector serves four watchers and refuses the rest.
        // Left pointing at a dead EventSource, this reads as a live stream to
        // anything that checks: the clock watcher would park it, take the
        // refusal off the indicator, and reconnect into the same full cap a
        // few seconds later to be refused again.
        es.close();
        stream = null;
        gaveUp = true;
        setState("gone", "refused");
        note("gap", "The collector refused this connection. It may already " +
             "have all the watchers it allows open, or it may be shutting " +
             "down. Close another tab and reload to try again.");
        return;
      }
      if (es.readyState === EventSource.CONNECTING) {
        failures += 1;
        setState("retry", "reconnecting");
        if (failures >= 5) {
          // The token changes when the collector restarts, so retrying past
          // this point can only fail. Better to say so than to spin quietly.
          es.close();
          stream = null;
          gaveUp = true;
          setState("gone", "the collector has closed");
          note("gap", "The stream has ended. If the collector is still " +
               "running, reload this page; if it was restarted, it printed a " +
               "new URL.");
        }
      }
    };
  }

  // Scrolling away from the bottom is how somebody says they want to read
  // something, so it clears the box rather than fighting them for the view;
  // scrolling back to the bottom says they are done, so it fills again. The
  // programmatic scroll above fires this too, and lands at the tail, so it
  // leaves the box exactly as it found it.
  scroller.addEventListener("scroll", function () {
    followBox.checked = atTail();
  });

  followBox.addEventListener("change", function () {
    if (following()) { toTail(); }
  });
  connect();
}());
</script>
</body>
</html>
